services:

  # ── MySQL 8 Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smart-dam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: smartdam
      MYSQL_DATABASE: smart_dam_db
    ports:
      - "3307:3306"          # expose so you can connect with MySQL Workbench too
    volumes:
      - mysql_data:/var/lib/mysql   # persist data across restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psmartdam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── .NET 10 Web App ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-dam-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=smart_dam_db;User=root;Password=smartdam;"
      DatabaseProvider: "MySql"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be ready before starting app

volumes:
  mysql_data:
