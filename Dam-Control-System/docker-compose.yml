services:

  # ── MySQL 8 Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smart-dam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: smartdam
      MYSQL_DATABASE: smart_dam_db
    ports:
      - "3307:3306"          # expose so you can connect with MySQL Workbench too
    volumes:
      - mysql_data:/var/lib/mysql   # persist data across restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psmartdam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spring Boot App ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-dam-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_dam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: smartdam
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be ready before starting app

volumes:
  mysql_data:
